<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 44" width="192" height="44" role="img" aria-label="BatchCOGS wordmark">
  <title>BatchCOGS</title>

  <!--
    Dark-background variant.
    Card surfaces: Fog #F0F3F5 (near-white) instead of Ink.
    Ledger lines: Ink #1C3D52 (reversed, dark lines on light card — same contrast logic).
    Amber bullets: unchanged — #D4911F works on both surfaces.
    Wordmark: Fog #F0F3F5.
    Use on: Void #0D1E28, Ink #1C3D52, any dark surface.
    Never use the light logo.svg on dark backgrounds.
  -->

  <!-- Back card -->
  <rect x="7" y="7" width="29" height="33" rx="2" fill="#F0F3F5" opacity="0.28"/>

  <!-- Front card -->
  <rect x="3" y="3" width="29" height="33" rx="2" fill="#F0F3F5"/>

  <!-- Row 1 -->
  <rect x="8"  y="12" width="3" height="3" rx="0.5" fill="#D4911F"/>
  <rect x="14" y="12.5" width="14" height="2" rx="1" fill="#1C3D52" opacity="0.75"/>

  <!-- Row 2 -->
  <rect x="8"  y="19" width="3" height="3" rx="0.5" fill="#D4911F"/>
  <rect x="14" y="19.5" width="14" height="2" rx="1" fill="#1C3D52" opacity="0.75"/>

  <!-- Row 3 (partial) -->
  <rect x="8"  y="26" width="3" height="3" rx="0.5" fill="#D4911F"/>
  <rect x="14" y="26.5" width="8"  height="2" rx="1" fill="#1C3D52" opacity="0.50"/>

  <text y="30"
        font-family="'DM Sans', 'Gill Sans MT', 'Century Gothic', system-ui, sans-serif"
        font-size="21.5"
        letter-spacing="-0.2">
    <tspan x="46" font-weight="600" fill="#F0F3F5">Batch</tspan><tspan
           font-weight="300" fill="#F0F3F5" letter-spacing="1.2">COGS</tspan>
  </text>
</svg>
